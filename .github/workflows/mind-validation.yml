name: Mind validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  self-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages required by self-hosting checks
        run: |
          pnpm --filter @lending-mind/sdk build
          pnpm --filter @lending-mind/skill build
          pnpm --filter @lending-mind/lmp build
      - name: Validate every shipped Mind package and evidence manifest
        run: pnpm validate:skills
      - name: Verify every canonical provenance source by its declared bytes
        run: pnpm verify:provenance
      - name: Verify every declared rule has an evaluator contract
        run: pnpm verify:rule-contracts
      - run: pnpm verify:self-hosting
      - run: cargo test --workspace --locked
      - run: pnpm verify:docs
