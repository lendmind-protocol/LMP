name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Install JavaScript workspace dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build the Rust MCP binary before adapter tests
        run: cargo build --workspace
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify every declared rule has an evaluator contract
        run: pnpm verify:rule-contracts
      - name: Verify documentation structure and internal routes
        run: pnpm verify:docs
      - name: Verify generated public registry assets are current
        run: |
          pnpm sync:public-registry
          git diff --exit-code -- registry/registry.json apps/docs/public/registry.json apps/docs/public/profiles
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Enforce the baseline Mind on the changed repository scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          target/release/lmp evaluate \
            --mind profiles/baseline \
            --workspace . \
            --scope crates,packages,registry/minds,docs,apps/docs/content/docs,scripts \
            --mode enforced \
            --changed-only \
            --base "$base" \
            --json
      - name: Run the local LMP self-governance audit
        run: pnpm verify:self-audit
      - name: Verify Rust and Node onboarding integration
        run: bash orchestrator/integration_test.sh
      - name: Measure greenfield and brownfield onboarding target
        run: python3 orchestrator/onboarding_benchmark.py --max-ms 3000
      - run: python3 -m compileall -q orchestrator
      - name: Run orchestration and release safety tests
        run: python3 -m unittest discover -s orchestrator -p 'test_*.py'
      - name: Validate evidence harvester contract
        run: |
          python3 orchestrator/mind_compiler.py \
            --entity example-style \
            --input orchestrator/fixtures/mind-harvester/contradictory-footprint.json \
            --output "$RUNNER_TEMP/lmp-mind-harvest.json"
          python3 orchestrator/mind_harvest_artifact_gate.py "$RUNNER_TEMP/lmp-mind-harvest.json"
