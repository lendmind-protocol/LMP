name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript workspace dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify documentation structure and internal routes
        run: pnpm verify:docs
      - name: Verify generated public registry assets are current
        run: |
          pnpm sync:public-registry
          git diff --exit-code -- registry/registry.json apps/docs/public/registry.json apps/docs/public/profiles
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Run the local LMP self-governance audit
        run: pnpm verify:self-audit
      - name: Verify Rust and Node onboarding integration
        run: bash orchestrator/integration_test.sh
      - name: Measure greenfield and brownfield onboarding target
        run: python3 orchestrator/onboarding_benchmark.py --max-ms 3000
      - run: python3 -m compileall -q orchestrator
      - name: Run orchestration and release safety tests
        run: python3 -m unittest discover -s orchestrator -p 'test_*.py'
      - name: Validate evidence harvester contract
        run: |
          python3 orchestrator/mind_compiler.py \
            --entity example-style \
            --input orchestrator/fixtures/mind-harvester/contradictory-footprint.json \
            --output "$RUNNER_TEMP/lmp-mind-harvest.json"
          python3 orchestrator/mind_harvest_artifact_gate.py "$RUNNER_TEMP/lmp-mind-harvest.json"
