name: Lending-Mind Protocol Benchmark Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install JavaScript workspace dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build the Rust MCP binary before adapter tests
        run: cargo build --workspace
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify generated public registry assets are current
        run: |
          pnpm sync:public-registry
          git diff --exit-code -- registry/registry.json apps/docs/public/registry.json apps/docs/public/profiles
      - name: Verify evaluator remediation and authorization evidence
        run: |
          pnpm verify:evaluator-integration
          for artifact in lmp-test-results/evaluator-integration/*.json; do
            python3 orchestrator/evaluator_artifact_gate.py "$artifact"
          done
          python3 orchestrator/render_evaluation_summary.py \
            lmp-test-results/evaluator-integration/"$(find lmp-test-results/evaluator-integration -maxdepth 1 -name '*.json' | sort | head -n 1 | xargs -n1 basename)" \
            --output lmp-test-results/evaluator-integration-summary.md
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Verify Rust and Node onboarding integration
        run: bash orchestrator/integration_test.sh
      - name: Measure greenfield and brownfield onboarding target
        run: python3 orchestrator/onboarding_benchmark.py --max-ms 3000 --output lmp-test-results/onboarding-current.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run orchestration and release safety tests
        run: python3 -m unittest discover -s orchestrator -p 'test_*.py'
      - name: Build required sandbox image
        run: docker build -t lmp-sandbox:local orchestrator
      - name: Run qualification matrix
        run: python3 orchestrator/qualification_suite.py --lmp target/release/lmp --lmpd target/release/lmpd --mcp target/release/lmp-mcp --output lmp-test-results/qualification-result.json
      - name: Run real OSS benchmark matrix
        run: python3 orchestrator/real_world_benchmark.py --lmp target/release/lmp --output lmp-test-results/real-world
      - name: Validate technical benchmark evidence contract
        run: python3 orchestrator/benchmark_artifact_gate.py lmp-test-results/real-world/real-world-benchmark.json
      - name: Publish benchmark job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          qualification = Path("lmp-test-results/qualification-result.json")
          benchmark = Path("lmp-test-results/real-world/real-world-benchmark.json")
          print("## LMP benchmark evidence")
          for label, path in (("Qualification", qualification), ("Real-world benchmark", benchmark)):
              if not path.is_file():
                  print(f"- **{label}:** artifact missing")
                  continue
              data = json.loads(path.read_text())
              print(f"- **{label}:** `{data.get('status', 'unknown')}`")
              if label == "Qualification":
                  print(f"  - Scenarios: `{data.get('scenarioCount', 0)}/{data.get('expectedScenarioCount', 0)}`")
              else:
                  summary = data.get("summary", {})
                  print(f"  - Transitions: `{summary.get('passedTransitions', 0)}/{summary.get('expectedScenarioCount', 0)}`")
                  print(f"  - Docker gates: `{summary.get('dockerGatesPassed', 0)}/{summary.get('dockerGatesExpected', 0)}`")
                  print(f"  - Ordinary compiler controls: `{summary.get('controlChecksPassed', 0)}/{summary.get('controlChecksExpected', 0)}`")
          PY
      - name: Verify signed static sync path
        run: bash orchestrator/test_registry_sync.sh
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmp-benchmark-evidence
          path: lmp-test-results
      - run: python3 orchestrator/test_bed.py
