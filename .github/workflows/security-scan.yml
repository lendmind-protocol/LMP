name: Lending-Mind Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          toolchain: 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-security-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  node-audit:
    name: Audit Node dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  sandbox-policy:
    name: Assert sandbox hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce zero-trust container flags
        run: |
          grep -q '"--network=none"' orchestrator/sandbox.py
          grep -q '"--read-only"' orchestrator/sandbox.py
          grep -q '"--cap-drop=ALL"' orchestrator/sandbox.py
          grep -q '"--security-opt=no-new-privileges"' orchestrator/sandbox.py
          grep -q '"--memory=128m"' orchestrator/sandbox.py
          grep -q '"--pids-limit=128"' orchestrator/sandbox.py
