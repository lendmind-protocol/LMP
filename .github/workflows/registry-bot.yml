name: Lending-Mind Registry Verification Bot

on:
  pull_request:
    branches: [main]
    paths:
      - "registry/definitions/**"
      - "registry/registry.json"
      - "apps/docs/public/registry.json"
      - "orchestrator/registry_gate.py"
      - "crates/lmp-core/**"
      - "Cargo.toml"
      - "Cargo.lock"

# Validation runs without repository secrets and with read-only permissions.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: registry-bot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate signed registry packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request for unprivileged validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-registry-bot-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build trusted validator
        run: cargo build --bin lmp

      - name: Verify changed package signatures and schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 orchestrator/registry_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" --lmp target/debug/lmp | tee registry-gate.json

      - name: Enforce canonical registry index parity
        run: cmp --silent registry/registry.json apps/docs/public/registry.json

      - name: Verify local registry manifest metadata
        run: python3 orchestrator/registry_manifest_gate.py registry/registry.json --lmp target/debug/lmp

      # Immutable IPFS/OCI CIDs are an external release gate. They are not a
      # prerequisite for validating a signed contribution in this repository.
      # The release workflow remains responsible for rejecting a public index
      # that has not been pinned and independently retrieved.

      - name: Run Rust and orchestration regression gates
        run: |
          cargo test --workspace
          python3 -m compileall -q orchestrator
          python3 orchestrator/test_bed.py
