name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install JavaScript workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated public registry assets are current
        run: |
          pnpm sync:public-registry
          git diff --exit-code -- registry/registry.json apps/docs/public/registry.json apps/docs/public/profiles
      - name: Reject production profiles without source-backed rule evidence
        run: LMP_REQUIRE_SOURCE_BACKED=1 node --import tsx public-web-vault/scripts/validate-registry.ts public-web-vault/registry.json
      - name: Verify the product release version
        run: python3 orchestrator/release_version_gate.py "${GITHUB_REF_NAME}"
      - name: Lint JavaScript workspace
        run: pnpm lint
      - name: Verify documentation structure and internal routes
        run: pnpm verify:docs
      - name: Verify publishable package boundaries
        run: pnpm verify:public-packages
      - name: Typecheck JavaScript workspace
        run: pnpm typecheck
      - name: Build documentation portal
        run: pnpm --filter @lending-mind/docs build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Run the local LMP self-governance audit
        run: pnpm verify:self-audit
      - name: Verify Rust and Node onboarding integration
        run: bash orchestrator/integration_test.sh
      - name: Measure greenfield and brownfield onboarding target
        run: python3 orchestrator/onboarding_benchmark.py --max-ms 3000
      - name: Execute bundled profile evidence fixtures
        run: pnpm verify:profile-fixtures
      - name: Run evaluator integration evidence gate
        run: |
          pnpm verify:evaluator-integration
          for artifact in lmp-test-results/evaluator-integration/*.json; do
            python3 orchestrator/evaluator_artifact_gate.py "$artifact"
          done
          python3 orchestrator/render_evaluation_summary.py \
            lmp-test-results/evaluator-integration/"$(find lmp-test-results/evaluator-integration -maxdepth 1 -name '*.json' | sort | head -n 1 | xargs -n1 basename)" \
            --output lmp-test-results/evaluator-integration-summary.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run orchestration and release safety tests
        run: python3 -m unittest discover -s orchestrator -p 'test_*.py'
      - name: Build required sandbox image
        run: docker build -t lmp-sandbox:local orchestrator
      - name: Measure daemon idle resource budget
        run: |
          idle_workspace="$(mktemp -d)"
          trap 'find "$idle_workspace" -mindepth 1 -delete; rmdir "$idle_workspace"' EXIT
          python3 orchestrator/resource_gate.py --lmpd target/release/lmpd --mind profiles/baseline/mind.json --workspace "$idle_workspace" --output lmp-test-results/resource-gate.json
      - name: Run qualification gate
        run: python3 orchestrator/qualification_suite.py --lmp target/release/lmp --lmpd target/release/lmpd --mcp target/release/lmp-mcp --output lmp-test-results/qualification-result.json
      - name: Run real OSS benchmark gate
        run: >-
          python3 orchestrator/real_world_benchmark.py
          --lmp target/release/lmp
          --output lmp-test-results/real-world
          --reviewer-annotations docs/release-evidence/benchmark-review.json
      - name: Validate benchmark evidence contract
        run: python3 orchestrator/benchmark_artifact_gate.py lmp-test-results/real-world/real-world-benchmark.json --require-clean
      - name: Verify bundled profile signatures and static sync
        run: |
          for profile in packages/create-lmp/profiles/*; do
            test "$(target/release/lmp verify "$profile" | python3 -c 'import json,sys; print(json.load(sys.stdin)["signatureStatus"])')" = verified
          done
          bash orchestrator/test_registry_sync.sh
      - name: Publish signed Mind files to Pinata public IPFS
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GROUP_ID: ${{ secrets.PINATA_GROUP_ID }}
          PINATA_GATEWAY_DOMAIN: ${{ secrets.PINATA_GATEWAY_DOMAIN }}
        run: |
          pnpm publish:ipfs:pinata
          pnpm sync:public-registry
      - name: Enforce production registry metadata
        run: python3 orchestrator/registry_release_gate.py registry/registry.json --verify-cids
      - name: Verify registry index matches signed package bytes
        run: python3 orchestrator/registry_manifest_gate.py registry/registry.json --lmp target/release/lmp
      - name: Preserve the verifier for aggregate release readiness
        run: cp target/release/lmp lmp-test-results/lmp
      - name: Verify deployed static portal
        env:
          LMP_DEPLOYMENT_URL: https://lmp-six.vercel.app
        run: |
          python3 orchestrator/verify_static_deployment.py "$LMP_DEPLOYMENT_URL" \
            --expected-registry registry/registry.json \
            --check-manifests \
            --require-https
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: lmp-test-results
          if-no-files-found: error

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Smoke-test native release binaries
        shell: bash
        run: python orchestrator/release_binary_smoke.py --target "${{ matrix.target }}" --binary-dir "target/${{ matrix.target }}/release"
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          python orchestrator/package_release_artifact.py \
            --target "${{ matrix.target }}" \
            --binary-dir "target/${{ matrix.target }}/release" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: lmp-${{ matrix.target }}
          path: dist/lmp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lmp-*
          merge-multiple: true
      - name: Write archive checksums with release-relative filenames
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Verify release archives and checksums
        run: python3 orchestrator/release_artifact_gate.py dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: lmp-test-results
      - name: Compose fail-closed release readiness decision
        run: >-
          python3 orchestrator/release_readiness.py
          --qualification lmp-test-results/qualification-result.json
          --benchmark lmp-test-results/real-world/real-world-benchmark.json
          --registry registry/registry.json
          --lmp lmp-test-results/lmp
          --resource-report lmp-test-results/resource-gate.json
          --onboarding lmp-test-results/onboarding-current.json
          --deployment https://lmp-six.vercel.app
          --expected-registry registry/registry.json
          --check-manifests
          --verify-cids
          --release-artifacts dist
          --human-pilot-report docs/release-evidence/human-adoption-pilot.json
          --remote-source origin
          --remote-branch main
          --require-clean
          --output lmp-test-results/release-readiness.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-public-packages:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build public package set in dependency order
        run: |
          pnpm --filter @lending-mind/sdk build
          pnpm --filter @lending-mind/skill build
          pnpm --filter @lending-mind/lmp build
          pnpm --filter lmp pack --dry-run
          pnpm --filter @lending-mind/mcp build
          pnpm verify:public-packages
      - name: Publish public package set in dependency order
        run: |
          test -n "$NPM_TOKEN" || { echo "NPM_TOKEN is required when PUBLISH_NPM=true" >&2; exit 1; }
          for package in packages/core packages/skill-schema packages/cli packages/lmp packages/mcp-server packages/create-lmp; do
            pnpm --dir "$package" publish --access public --no-git-checks
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
