[package]
name = "lmp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
sha2 = "0.10"
anyhow = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
clap = { version = "4.4", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
